name: E2E Regression (Fast Run - Static Service)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:

  Edge_Windows_Test:
    runs-on: windows-latest
    permissions:
      checks: write

    steps:

      # -----------------------------------------------------
      # 1. إعداد البيئة (Checkout & Node)
      # -----------------------------------------------------
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (for http-server)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # -----------------------------------------------------
      # 2. تشغيل الواجهة الأمامية (Frontend Service)
      # -----------------------------------------------------

      - name: 🛠️ Install http-server Globally
        run: npm install -g http-server

      - name: 🩹 Fix Angular Base Href
        shell: pwsh
        run: |
          $indexPath = "./${{ env.FRONTEND_BUILD_DIR }}/index.html"
          Write-Host "Modifying base href in ${indexPath}: / -> ./"
          (Get-Content -Path $indexPath) -replace '<base href="/">', '<base href="./">' | Set-Content $indexPath

      - name: 🚀 Start Frontend Server (Port 4300)
        shell: bash # 🛑 تغيير Shell إلى Bash
        run: |
            BUILD_DIR="./${{ env.FRONTEND_BUILD_DIR }}"
            echo "Starting http-server on directory: $BUILD_DIR on port 4300 using nohup"
            
            # استخدام nohup & لتشغيل الخادم في الخلفية بشكل موثوق، وتوجيه الإخراج إلى ملف
            nohup http-server "$BUILD_DIR" -p 4300 -a 127.0.0.1 > server.log 2>&1 &
            
            sleep 5
            cat server.log # عرض سجل التشغيل للتشخيص

      # انتظار تشغيل التطبيق
      - name: ⏱️ Wait until App is running on Port 4300
        shell: pwsh # العودة إلى PowerShell للفحص
        run: |
            $max = 30
            for ($i=0; $i -lt $max; $i++) {
              try {
                # فحص المنفذ 4300 باستخدام عنوان 127.0.0.1
                Invoke-WebRequest -Uri "http://127.0.0.1:4300" -UseBasicParsing | Out-Null
                Write-Host "✅ Angular Frontend is UP on port 4300!"
                exit 0
              } catch {
                Write-Host "Waiting for Angular on port 4300... ($($i + 1)/$max)"
                Start-Sleep -Seconds 3
              }
            }
            Write-Host "❌ Angular FAILED to start!"
            exit 1

      # -----------------------------------------------------
      # 3. إعداد Java و Maven
      # -----------------------------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # -----------------------------------------------------
      # 4. تشغيل الاختبارات (Test Execution)
      # -----------------------------------------------------
      - name: 🧪 Run Selenium Tests (Edge)
        run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://localhost:4300" clean test

      # -----------------------------------------------------
      # 5. رفع التقارير (Artifact Upload)
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
       # 🛑 إضافة هذا الشرط لضمان التنفيذ حتى عند فشل الاختبارات
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: Edge_Windows_Report
            # تأكد من أن هذا المسار صحيح، غالبًا ما يخرج Maven التقارير هنا
            path: test-output/reports/*.html
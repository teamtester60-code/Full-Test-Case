name: E2E Regression - Regression Test (Self-hosted)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    
  workflow_dispatch:

env:
  FRONTEND_PORT: 4200
  BASE_URL: http://127.0.0.1:4200

  EXECUTION_TYPE: localHeadless
  BROWSER: EDGE


  MONGO_URI: mongodb://localhost:27017
  MONGO_DB: Quiz

jobs:
  login_test:
    runs-on: self-hosted

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 🔍 Verify Environment
        shell: powershell
        continue-on-error: true
        run: |
          java -version
          mvn -version
          Write-Host "Base URL: $env:BASE_URL"
          Write-Host "Browser: $env:BROWSER"
          Write-Host "Execution Type: $env:EXECUTION_TYPE"
          Write-Host "Mongo URI: $env:MONGO_URI"
          Write-Host "Mongo DB: $env:MONGO_DB"

      - name: ✅ Check Frontend Running
        shell: powershell
        run: |
          try {
            $resp = Invoke-WebRequest -Uri $env:BASE_URL -UseBasicParsing -TimeoutSec 10
            Write-Host "Frontend reachable: $($resp.StatusCode)"
          } catch {
            Write-Host "Frontend is NOT reachable at $env:BASE_URL"
            exit 1
          }

      - name: ✅ Check MongoDB Port
        shell: powershell
        run: |
          if (!(netstat -an | findstr ":27017")) {
            Write-Host "MongoDB not running on port 27017!"
            exit 1
          } else {
            Write-Host "MongoDB is running on port 27017"
          }

      - name: 🧪 Run Regression Tests (XML)
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "🚀 Running TestNG XML suite..."
          mvn test `
            -DsuiteXmlFile=src/test/resources/testng.xml `
            -Dmaven.test.failure.ignore=true `
            "-DexecutionType=$env:EXECUTION_TYPE" `
            "-DbrowserType=$env:BROWSER" `
            "-DbaseUrl=$env:BASE_URL" `
            "-Dmongo.uri=$env:MONGO_URI" `
            "-Dmongo.db=$env:MONGO_DB"

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RegressionTest
          path: test-output/reports/*.html

name: E2E Regression (Login Test - Refactored for Self-hosted)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  # -----------------------------------------------------
  # 📌 إعدادات المنافذ والمسارات (Ports and Paths)
  # يتم الاحتفاظ بها لاستخدامها في أمر Maven
  # -----------------------------------------------------
  LOGIN_TEST_TARGET: "LoginTest"

jobs:
  Login_Test:
    # 🚨 التغيير الرئيسي: استخدام الـ Runner المحلي
    runs-on: self-hosted

    # 💡 ملاحظة: يتم إزالة الإذن 'permissions' حيث أن الـ Self-hosted Runner يمتلك صلاحيات الجهاز الذي يعمل عليه.

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 1. إعداد متطلبات تشغيل الاختبار
      # -----------------------------------------------------
      # ☕ إعداد Java (يجب أن يكون Java موجوداً على الـ Runner أو يتم تثبيته)
      - name: ☕ Setup Java (for Selenium Tests)
        # ⚠️ ملاحظة: إذا كان Java مثبتاً بالفعل على الـ Runner، يمكن إزالة هذه الخطوة.
        # إذا لم يكن مثبتاً، فستقوم هذه الخطوة بتثبيته.
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 📦 إعداد Maven (يجب أن يكون Maven موجوداً على الـ Runner أو يتم تثبيته)
      - name: 📦 Setup Maven (for Selenium Tests)
        # ⚠️ ملاحظة: إذا كان Maven مثبتاً بالفعل على الـ Runner وموجوداً في متغيرات البيئة (PATH)، يمكن إزالة هذه الخطوة.
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # -----------------------------------------------------
      # 2. تشغيل الاختبارات
      # -----------------------------------------------------
      - name: 🧪 Run Login Test (Simplified)
        # هذا هو الأمر المطلوب تشغيله.
        # يتم استخدام متغير البيئة FRONTEND_PORT لتمرير الـ BaseUrl
        run: mvn -Dtest=${{ env.LOGIN_TEST_TARGET }} -DexecutionType="LocalHeadless" -DbrowserType="Edge"test

      # -----------------------------------------------------
      # 3. خطوة اختيارية: رفع التقارير
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Login_Test_Report
          path: test-output/reports/*.html
name: Daily Tests on Windows with Edge

on:
  schedule:
    # Runs every day at 10:30 AM (UTC)
    - cron: '30 10 * * *'
  # Also run on push to main branch and pull requests
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'microsoft'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~\.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: تثبيت Microsoft Edge
      run: |
        # تثبيت Microsoft Edge باستخدام Winget (أسهل طريقة على Windows)
        Write-Host "جاري تثبيت Microsoft Edge..."
        winget install --id=Microsoft.Edge --silent --accept-package-agreements --accept-source-agreements
        
        # انتظار اكتمال التثبيت
        Start-Sleep -Seconds 10
        
        # التحقق من التثبيت
        $edgePath = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
        if (Test-Path $edgePath) {
          $version = & $edgePath --version
          Write-Host "تم تثبيت Microsoft Edge بنجاح - الإصدار: $version"
        } else {
          Write-Error "فشل تثبيت Microsoft Edge"
          exit 1
        }
        
        # تثبيت WebDriver
        Write-Host "جاري تثبيت WebDriver..."
        $driverUrl = "https://msedgedriver.azureedge.net/LATEST_RELEASE"
        $version = Invoke-RestMethod -Uri $driverUrl
        $driverUrl = "https://msedgedriver.azureedge.net/$version/edgedriver_win64.zip"
        $driverZip = "$env:TEMP\msedgedriver.zip"
        $driverPath = "$env:ProgramFiles\Microsoft Web Driver"
        
        Invoke-WebRequest -Uri $driverUrl -OutFile $driverZip
        Expand-Archive -Path $driverZip -DestinationPath $env:TEMP -Force
        New-Item -ItemType Directory -Path $driverPath -Force | Out-Null
        Copy-Item "$env:TEMP\msedgedriver_win64\msedgedriver.exe" -Destination $driverPath -Force
        
        # إضافة WebDriver إلى متغيرات النظام
        $env:Path += ";$driverPath"
        [System.Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::Machine)
        
        # التحقق من تثبيت WebDriver
        if (Test-Path "$driverPath\msedgedriver.exe") {
          Write-Host "تم تثبيت WebDriver بنجاح"
        } else {
          Write-Error "فشل تثبيت WebDriver"
          exit 1
        }

    - name: Build and test with Maven
      run: mvn clean test
      env:
        # Set Edge WebDriver path (WebDriver is included with Edge on Windows)
        EDGE_WEBDRIVER_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedgedriver.exe"
        # Add any other required environment variables here
        # Example:
        # DB_URL: jdbc:sqlserver://localhost:1433;databaseName=testdb
        # DB_USERNAME: sa
        # DB_PASSWORD: your_strong_password

    - name: إنشاء تقرير Allure
      if: always()
      run: |
        # تثبيت Allure Commandline
        npm install -g allure-commandline --save-dev
        
        # إنشاء مجلد للتقارير إذا لم يكن موجوداً
        $reportDir = "allure-report"
        $resultsDir = "allure-results"
        
        if (Test-Path $resultsDir) {
          # إنشاء تقرير Allure
          allure generate $resultsDir -o $reportDir --clean
          
          # إنشاء ملف index.html للعرض
          $htmlContent = @"
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Results</title>
              <meta http-equiv="refresh" content="0; url=allure-report/index.html">
          </head>
          <body>
              <p>جاري التوجيه إلى <a href="allure-report/index.html">تقرير الاختبارات</a>...</p>
          </body>
          </html>
          "@
          
          $htmlContent | Out-File -FilePath "$reportDir\index.html" -Encoding utf8
        } else {
          Write-Host "لم يتم العثور على نتائج Allure لتوليد التقرير"
        }
      
    - name: رفع نتائج الاختبارات
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          allure-report/
          test-output/
        retention-days: 5

name: E2E Regression (Fast Run - Static Service) # تم تغيير الاسم ليعكس الخدمة السريعة

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  # المسار المؤكد لمجلد البناء الذي يحتوي على index.html
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:

  Edge_Windows_Test:
    runs-on: windows-latest
    permissions:
      checks: write

    steps:

      # -----------------------------------------------------
      # 1. إعداد البيئة (Checkout & Node)
      # -----------------------------------------------------
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (for http-server)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # -----------------------------------------------------
      # 2. تشغيل الواجهة الأمامية (Frontend Service)
      # -----------------------------------------------------

      # تثبيت http-server عالمياً
      - name: 🛠️ Install http-server Globally
        run: npm install -g http-server

      # تشغيل http-server لخدمة مجلد البناء (في الخلفية باستخدام Start-Process)
      - name: 🚀 Start Frontend Server (Port 4600)
        shell: pwsh
        run: |
          # استخدام Start-Process لتشغيل http-server كعملية خلفية موثوقة
          Write-Host "Starting http-server on directory: ./${{ env.FRONTEND_BUILD_DIR }}"
          Start-Process -FilePath "http-server" -ArgumentList "./${{ env.FRONTEND_BUILD_DIR }}", "-p", "4600", "--silent" 
          Start-Sleep -Seconds 5 # إعطاء وقت كافٍ لبدء تشغيل الخادم

      # انتظار تشغيل التطبيق
      - name: ⏱️ Wait until App is running
        shell: pwsh
        run: |
          $max = 30
          for ($i=0; $i -lt $max; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:4600" -UseBasicParsing | Out-Null
              Write-Host "✅ Angular Frontend is UP on port 4600!"
              exit 0
            } catch {
              Write-Host "Waiting for Angular on port 4600... ($($i + 1)/$max)"
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "❌ Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 3. إعداد Java و Maven
      # -----------------------------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # -----------------------------------------------------
      # 4. تشغيل الاختبارات (Test Execution)
      # -----------------------------------------------------
      # تمرير المنفذ 4600 إلى اختبارات السيلينيوم
      - name: 🧪 Run Selenium Tests (Edge)
        run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://localhost:4600" clean test

      # -----------------------------------------------------
      # 5. رفع التقارير (Artifact Upload)
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Edge_Windows_Report
          path: test-output/reports/*.html
name: E2E Regression (Login Test - Refactored for Self-hosted)

on:
  schedule:
    # 9:30 AM and 10:30 AM UTC
    - cron: '30 9,10 * * *'
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  # -----------------------------------------------------
  # 📌 إعدادات المنافذ والمسارات (Ports and Paths)
  # يتم الاحتفاظ بها لاستخدامها في أمر Maven
  # -----------------------------------------------------
  FRONTEND_PORT: 4200
  LOGIN_TEST_TARGET: "RegressionTest"

jobs:
  Login_Test:
    # 🚨 التغيير الرئيسي: استخدام الـ Runner المحلي
    runs-on: self-hosted

    # 💡 ملاحظة: يتم إزالة الإذن 'permissions' حيث أن الـ Self-hosted Runner يمتلك صلاحيات الجهاز الذي يعمل عليه.

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v6

      # -----------------------------------------------------
      # 1. إعداد متطلبات تشغيل الاختبار
      # -----------------------------------------------------



      # -----------------------------------------------------
      # 2. تشغيل الاختبارات
      # -----------------------------------------------------
      - name: 🧪 Run Regression Test (Simplified)
        continue-on-error: true
        run: mvn -Dtest="*Test,*TEST,*test*" -DexecutionType="localHeadless" -DbrowserType="Edge" -DbaseUrl="http://127.0.0.1:${{ env.FRONTEND_PORT }}" test


      # -----------------------------------------------------
      # 3. خطوة اختيارية: رفع التقارير
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RegressionTest
          path: test-output/reports/*.html
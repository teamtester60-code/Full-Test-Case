name: Daily Tests on Windows with Edge

on:
  schedule:
    # Runs every day at 10:30 AM (UTC)
    - cron: '30 10 * * *'
  # Also run on push to main branch and pull requests
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'microsoft'
        
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~\.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Set up Microsoft Edge
      uses: browser-actions/setup-edge@v2
      with:
        channel: 'stable'
        
    - name: Verify Edge installation
      run: |
        $edgePath = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
        if (Test-Path $edgePath) {
          Write-Host "Microsoft Edge is installed at: $edgePath"
          & $edgePath --version
        } else {
          Write-Error "Microsoft Edge not found at expected location"
          exit 1
        }

    - name: Build and test with Maven
      run: mvn clean test
      env:
        # Set Edge WebDriver path (WebDriver is included with Edge on Windows)
        EDGE_WEBDRIVER_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedgedriver.exe"
        # Add any other required environment variables here
        # Example:
        # DB_URL: jdbc:sqlserver://localhost:1433;databaseName=testdb
        # DB_USERNAME: sa
        # DB_PASSWORD: your_strong_password

#       Uncomment and modify the following section if you have Allure reports
    - name: Generate Allure Report
      if: always()
      uses: simple-elf/allure-report-action@v1
      with:
         allure_results: target/allure-results
         enable_charts: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: test-output/reports/*.html
        retention-days: 5

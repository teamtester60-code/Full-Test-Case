name: E2E Regression (Login Test - Full Stack)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  # -----------------------------------------------------
  # 📌 إعدادات المنافذ والمسارات (Ports and Paths)
  # -----------------------------------------------------
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  BACKEND_PUBLISH_DIR: POS-19-10-2025/POS-BackPublish
  FRONTEND_PORT: 4300
  BACKEND_API_PORT: 56740
  ASPNETCORE_URLS: http://127.0.0.1:56740
  LOGIN_TEST_TARGET: "LoginTest"

jobs:
  Login_Test:
    runs-on: windows-latest # استخدام Windows Runner
    permissions:
      contents: read
      packages: read
      checks: write

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 1. إعداد الخدمات المساعدة (MongoDB و .NET)
      # -----------------------------------------------------
      - name: ⚙️ Install Required .NET Runtime 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'



      - name: 🚀 Start MongoDB Container and Wait
        shell: pwsh
        run: |
            # تشغيل الحاوية وتسجيل الـ Container ID في متغير بيئة مؤقت
            $containerID = docker run --name mongodb -p 27017:27017 -d mongo:latest
            echo "MongoDB Container ID: $containerID"
            
            $MAX_ATTEMPTS = 60 # 60 attempts * 2 seconds = 120s
            
            echo "Starting log check loop for MongoDB..."
            
            # الانتظار حتى تظهر رسالة "waiting for connections" في السجلات
            for ($i = 1; $i -le $MAX_ATTEMPTS; $i++) {
                $logOutput = docker logs mongodb 2>&1
            
                if ($logOutput -like "*waiting for connections*" -or $logOutput -like "*listening on*") {
                    echo "✅ MongoDB is UP! Found connection message in logs."
                    exit 0
                }
                echo "Waiting for MongoDB to initialize... ($i/$MAX_ATTEMPTS)"
                Start-Sleep -Seconds 2
            }
            
            echo "❌ MongoDB FAILED to initialize after $(($MAX_ATTEMPTS * 2)) seconds!"
            # عرض السجلات الأخيرة للتشخيص
            docker logs mongodb
            exit 1


      # -----------------------------------------------------
      # 2. تشغيل الواجهة الخلفية (Backend)
      # -----------------------------------------------------
      - name: 🚀 Start Backend Service (Port ${{ env.BACKEND_API_PORT }})
        shell: pwsh # 🛑 التغيير إلى PowerShell
        env:
            ASPNETCORE_URLS: ${{ env.ASPNETCORE_URLS }}
            MongoConnection__ConnectionString: mongodb://127.0.0.1:27017/?minPoolSize=10&maxPoolSize=50
            ApplicationSettings__Report_Connection: mongodb://127.0.0.1:27017

        run: |
            $logFile = "${{ env.BACKEND_PUBLISH_DIR }}/backend.log"
            
            echo "Starting .NET Kestrel server on port ${{ env.BACKEND_API_PORT }} using EXE via PowerShell"
            
            # بدء العملية في الخلفية باستخدام Start-Process على Windows
            Start-Process -FilePath "${{ env.BACKEND_PUBLISH_DIR }}/POS.Web.exe" `
                       -RedirectStandardOutput $logFile `
                       -RedirectStandardError $logFile `
                       -NoNewWindow
            
            # الانتظار لمدة قصيرة للسماح ببدء العملية
            Start-Sleep -Seconds 10
            echo "--- Backend Log Snippet (After 10s) ---"
            Get-Content $logFile
            echo "---------------------------"

      - name: ⏱️ Wait until Backend API is running
        shell: bash
        run: |
                MAX_ATTEMPTS=40 # 🛑 زيادة الوقت إلى 120 ثانية
                API_URL="http://127.0.0.1:${{ env.BACKEND_API_PORT }}" 
                
                echo "Starting wait loop for API on $API_URL"
                for i in $(seq 1 $MAX_ATTEMPTS); do
                  if curl -s --head --fail "$API_URL" ; then 
                    echo "✅ Backend API is UP on port ${{ env.BACKEND_API_PORT }}!"
                    exit 0
                  else
                    echo "Waiting for API on port ${{ env.BACKEND_API_PORT }}... ($i/$MAX_ATTEMPTS)"
                    sleep 3
                  fi
                done
                echo "❌ Backend API FAILED to start!"
                
                # 🛑 عند الفشل، عرض السجل الكامل للتشخيص
                echo "--- Final Backend Log for Diagnosis ---"
                cat ${{ env.BACKEND_PUBLISH_DIR }}/backend.log
                echo "---------------------------------------"
                
                exit 1

      # -----------------------------------------------------
      # 3. تشغيل الواجهة الأمامية (Frontend)
      # -----------------------------------------------------
      - name: ⚙️ Setup Node.js (for serve)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🛠️ Install serve Globally
        run: npm install -g serve

      - name: 🩹 Fix Angular Base Href (PowerShell)
        shell: pwsh
        run: |
          $indexPath = "./${{ env.FRONTEND_BUILD_DIR }}/index.html"
          (Get-Content -Path $indexPath) -replace '<base href="/">', '<base href="./">' | Set-Content $indexPath

      - name: 🚀 Start Frontend Server (Port ${{ env.FRONTEND_PORT }})
        shell: bash
        run: |
          BUILD_DIR="./${{ env.FRONTEND_BUILD_DIR }}"
          # تشغيل Serve في الخلفية
          nohup serve -s "$BUILD_DIR" -l ${{ env.FRONTEND_PORT }} > server.log 2>&1 &
          sleep 5
          cat server.log

      - name: ⏱️ Wait until Frontend App is running
        shell: bash
        run: |
          MAX_ATTEMPTS=30
          URL="http://127.0.0.1:${{ env.FRONTEND_PORT }}"
          
          echo "Starting wait loop using curl on $URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -s --head --fail "$URL" ; then
              echo "✅ Angular Frontend is UP on port ${{ env.FRONTEND_PORT }}!"
              exit 0
            else
              echo "Waiting for Angular on port ${{ env.FRONTEND_PORT }}... ($i/$MAX_ATTEMPTS)"
              sleep 3
            fi
          done
          echo "❌ Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 4. تشغيل اختبارات الأتمتة
      # -----------------------------------------------------
      - name: ☕ Setup Java (for Selenium Tests)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven (for Selenium Tests)
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 🧪 Run Login Test
        # سيعمل الاختبار الآن بعد التأكد من أن الواجهة الأمامية والخلفية تعملان
        run: mvn -Dtest=${{ env.LOGIN_TEST_TARGET }} -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://127.0.0.1:${{ env.FRONTEND_PORT }}" test

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Login_Test_Report
          path: test-output/reports/*.html
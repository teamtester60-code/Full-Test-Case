name: Daily Tests on Windows with Edge

on:
  schedule:
    # Runs every day at 10:30 AM (UTC)
    - cron: '30 10 * * *'
  # Also run on push to main branch and pull requests
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'microsoft'
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~\.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: تثبيت Microsoft Edge و WebDriver
      run: |
        # تثبيت Microsoft Edge
        Write-Host "جاري تثبيت Microsoft Edge..."
        $edgeInstaller = "$env:TEMP\\MicrosoftEdgeEnterpriseX64.msi"
        
        # تحميل Edge من الرابط المباشر
        $edgeUrl = "https://go.microsoft.com/fwlink/?linkid=2108834"
        Invoke-WebRequest -Uri $edgeUrl -OutFile $edgeInstaller
        
        # تثبيت Edge
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "`"$edgeInstaller`"", "/qn" -Wait
        
        # التحقق من التثبيت
        $edgePath = "${env:ProgramFiles(x86)}\\Microsoft\\Edge\\Application\\msedge.exe"
        if (Test-Path $edgePath) {
          $version = (Get-Item $edgePath).VersionInfo.ProductVersion
          Write-Host "تم تثبيت Microsoft Edge بنجاح - الإصدار: $version"
          
          # تثبيت WebDriver
          Write-Host "جاري تثبيت WebDriver..."
          $driverUrl = "https://msedgedriver.azureedge.net/${version}/edgedriver_win64.zip"
          $driverZip = "$env:TEMP\\msedgedriver.zip"
          $driverPath = "$env:ProgramFiles\\Microsoft Web Driver"
          
          try {
              Invoke-WebRequest -Uri $driverUrl -OutFile $driverZip -ErrorAction Stop
              Expand-Archive -Path $driverZip -DestinationPath $env:TEMP -Force
              New-Item -ItemType Directory -Path $driverPath -Force | Out-Null
              
              # البحث عن ملف msedgedriver.exe في المجلدات الفرعية
              $driverExe = Get-ChildItem -Path $env:TEMP -Recurse -Filter "msedgedriver.exe" | Select-Object -First 1
              if ($driverExe) {
                  Copy-Item -Path $driverExe.FullName -Destination $driverPath -Force
                  Write-Host "تم تثبيت WebDriver بنجاح في: $driverPath"
                  
                  # إضافة إلى متغيرات النظام
                  $env:Path = "$driverPath;" + $env:Path
                  [System.Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::Machine)
              } else {
                  Write-Warning "تعذر العثور على ملف msedgedriver.exe بعد فك الضغط"
              }
          } catch {
              Write-Warning "فشل تحميل WebDriver: $_"
          }
        } else {
          Write-Error "فشل تثبيت Microsoft Edge"
          exit 1
        }

    - name: Build and test with Maven
      run: mvn clean test
      env:
        # Set Edge WebDriver path (WebDriver is included with Edge on Windows)
        EDGE_WEBDRIVER_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedgedriver.exe"
        # Add any other required environment variables here
        # Example:
        # DB_URL: jdbc:sqlserver://localhost:1433;databaseName=testdb
        # DB_USERNAME: sa
        # DB_PASSWORD: your_strong_password

    - name: إنشاء تقرير الاختبارات
      if: always()
      run: |
        # إنشاء تقرير نصي بسيط للنتائج
        $reportDir = "test-reports"
        New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
        
        $testResults = @"
        <!DOCTYPE html>
        <html dir="rtl">
        <head>
            <meta charset="UTF-8">
            <title>نتائج الاختبارات</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                h1 { color: #1a73e8; }
                .success { color: #0f9d58; }
                .error { color: #d93025; }
                .warning { color: #f4b400; }
                pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
            </style>
        </head>
        <body>
            <h1>ملخص نتائج الاختبارات</h1>
            <p>تم تنفيذ الاختبارات بنجاح</p>
            <p>يمكنك العثور على المزيد من التفاصيل في ملفات السجل المرفقة</p>
        </body>
        </html>
        "@
        
        $testResults | Out-File -FilePath "$reportDir\\index.html" -Encoding utf8
        
        # نسخ ملفات السجل إذا وجدت
        if (Test-Path "test-output") {
            Copy-Item -Path "test-output\\*" -Destination $reportDir -Recurse -Force
        }
      
    - name: رفع نتائج الاختبارات
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-reports/
          test-output/
          target/surefire-reports/
        retention-days: 5

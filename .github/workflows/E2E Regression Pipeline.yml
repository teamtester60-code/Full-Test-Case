name: E2E Regression (Fast Run - Static Service)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:

  Edge_Windows_Test:
    runs-on: windows-latest
    permissions:
      checks: write

    steps:

      # -----------------------------------------------------
      # 1. إعداد البيئة (Checkout & Node)
      # -----------------------------------------------------
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (for http-server)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # -----------------------------------------------------
      # 2. تشغيل الواجهة الأمامية (Frontend Service)
      # -----------------------------------------------------

      # تثبيت http-server عالمياً
      - name: 🛠️ Install http-server Globally
        run: npm install -g http-server

      # تشغيل http-server لخدمة مجلد البناء (في الخلفية باستخدام CMD)
      - name: 🚀 Start Frontend Server (Port 4600)
        shell: cmd # استخدام CMD
        run: |
            echo Starting http-server on directory: ./%FRONTEND_BUILD_DIR%
            
            # استخدام أمر start ليعمل http-server في الخلفية
            start "" http-server ./%FRONTEND_BUILD_DIR% -p 4600 -a 0.0.0.0 --silent
            
            timeout /t 5 /nobreak

      # انتظار تشغيل التطبيق (نعود لاستخدام PowerShell للفحص الموثوق)
      - name: ⏱️ Wait until App is running
        shell: pwsh
        run: |
          $max = 10
          for ($i=0; $i -lt $max; $i++) {
            try {
              # Failsafe: Try to kill http-server job from previous runs if any
              Invoke-WebRequest -Uri "http://localhost:4600" -UseBasicParsing | Out-Null
              Write-Host "✅ Angular Frontend is UP on port 4600!"
              exit 0
            } catch {
              Write-Host "Waiting for Angular on port 4600... ($($i + 1)/$max)"
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "❌ Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 3. إعداد Java و Maven
      # -----------------------------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # -----------------------------------------------------
      # 4. تشغيل الاختبارات (Test Execution)
      # -----------------------------------------------------
      - name: 🧪 Run Selenium Tests (Edge)
        run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://localhost:4600" clean test

      # -----------------------------------------------------
      # 5. رفع التقارير (Artifact Upload)
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Edge_Windows_Report
          path: test-output/reports/*.html
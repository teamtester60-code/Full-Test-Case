name: E2E Regression (Login Test - Full Stack)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  # -----------------------------------------------------
  # 📌 إعدادات المنافذ والمسارات (Ports and Paths)
  # -----------------------------------------------------
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  BACKEND_PUBLISH_DIR: POS-19-10-2025/POS-BackPublish
  # المسار للملف الثنائي القابل للتنفيذ (Linux)
  BACKEND_BINARY_PATH: POS-19-10-2025/POS-BackPublish/POS.Web

  FRONTEND_PORT: 4300
  BACKEND_API_PORT: 56740
  ASPNETCORE_URLS: http://127.0.0.1:56740 # Kestrel URL
  LOGIN_TEST_TARGET: "LoginTest"

jobs:

  Login_Test:
    runs-on: ubuntu-latest # 🛑 التغيير إلى Linux لدعم خدمات Docker
    permissions:
      contents: read # ⬅️ ضروري لجلب الإجراءات مثل actions/checkout
      packages: read
      checks: write

    # 🛑 تشغيل خدمة MongoDB
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: --name mongodb

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 1. إعداد .NET Runtime 3.1 و MongoDB
      # -----------------------------------------------------
      - name: ⚙️ Install Required .NET Runtime 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: 🛠️ Set Permissions for Backend Binary
        # منح إذن التنفيذ للملف القابل للتشغيل على Linux
        run: chmod +x ${{ env.BACKEND_PUBLISH_DIR }}/POS.Web

      - name: ⏱️ Wait for MongoDB to start (Port 27017)
        shell: bash
        run: |
          MAX_ATTEMPTS=20
          MONGO_URL="http://mongodb:27017" # استخدام اسم الخدمة على Linux
          echo "Starting wait loop for MongoDB on $MONGO_URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            # فحص الاتصال
            if curl -s --head --fail "$MONGO_URL" ; then 
              echo "✅ MongoDB is UP!"
              exit 0
            else
              echo "Waiting for MongoDB... ($i/$MAX_ATTEMPTS)"
              sleep 3
            fi
          done
          echo "❌ MongoDB FAILED to start!"
          exit 1


      - name: 🚀 Start Backend Service (Port ${{ env.BACKEND_API_PORT }})
        shell: bash
        env:
          ASPNETCORE_URLS: ${{ env.ASPNETCORE_URLS }}
          # 🛑 استخدام اسم الخدمة (mongodb) في سلسلة الاتصال
          MongoConnection__ConnectionString: mongodb://mongodb:27017/?minPoolSize=10&maxPoolSize=50
          ApplicationSettings__Report_Connection: mongodb://mongodb:27017

        run: |
          echo "Starting .NET Kestrel server on port ${{ env.BACKEND_API_PORT }} using Binary"
          cd ${{ env.BACKEND_PUBLISH_DIR }}
          # تشغيل الملف الثنائي
          nohup ./POS.Web > backend.log 2>&1 & 
          cd -
          sleep 10
          echo "--- Backend Log Snippet ---"
          cat ${{ env.BACKEND_PUBLISH_DIR }}/backend.log
          echo "---------------------------"

      - name: ⏱️ Wait until Backend API is running
        shell: bash
        run: |
          MAX_ATTEMPTS=30
          API_URL="http://127.0.0.1:${{ env.BACKEND_API_PORT }}" 
          
          echo "Starting wait loop for API on $API_URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -s --head --fail "$API_URL" ; then 
              echo "✅ Backend API is UP on port ${{ env.BACKEND_API_PORT }}!"
              exit 0
            else
              echo "Waiting for API on port ${{ env.BACKEND_API_PORT }}... ($i/$MAX_ATTEMPTS)"
              sleep 3
            fi
          done
          echo "❌ Backend API FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 2. إعداد وتشغيل Angular Frontend
      # -----------------------------------------------------
      - name: ⚙️ Setup Node.js (for serve)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🛠️ Install serve Globally
        run: npm install -g serve

      - name: 🩹 Fix Angular Base Href (Linux/Bash)
        shell: bash
        run: |
          INDEX_PATH="./${{ env.FRONTEND_BUILD_DIR }}/index.html"
          # استخدام sed لتعديل الملف
          sed -i 's|<base href="/">|<base href="./">|g' "$INDEX_PATH"

      - name: 🚀 Start Frontend Server (Port ${{ env.FRONTEND_PORT }})
        shell: bash
        run: |
          BUILD_DIR="./${{ env.FRONTEND_BUILD_DIR }}"
          nohup serve -s "$BUILD_DIR" -l ${{ env.FRONTEND_PORT }} > server.log 2>&1 &
          sleep 5
          cat server.log

      - name: ⏱️ Wait until Frontend App is running
        shell: bash
        run: |
          MAX_ATTEMPTS=30
          URL="http://127.0.0.1:${{ env.FRONTEND_PORT }}"
          
          echo "Starting wait loop using curl on $URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -s --head --fail "$URL" ; then
              echo "✅ Angular Frontend is UP on port ${{ env.FRONTEND_PORT }}!"
              exit 0
            else
              echo "Waiting for Angular on port ${{ env.FRONTEND_PORT }}... ($i/$MAX_ATTEMPTS)"
              sleep 3
            fi
          done
          echo "❌ Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 3. تشغيل اختبارات Selenium
      # -----------------------------------------------------
      - name: ☕ Setup Java (for Selenium Tests)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven (for Selenium Tests)
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 🧪 Run Login Test
        run: mvn -Dtest=${{ env.LOGIN_TEST_TARGET }} -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://127.0.0.1:${{ env.FRONTEND_PORT }}" test

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Login_Test_Report
          path: test-output/reports/*.html
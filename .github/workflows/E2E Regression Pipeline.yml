name: E2E Regression - Login Test (Self-hosted)

on:
  push:
    branches: [ master, main ]

  pull_request:
    branches: [ master, main ]

  schedule:
    # ⏰ 9:30 AM & 10:30 AM UTC
    - cron: '30 9,10 * * *'

  workflow_dispatch:

# -----------------------------------------------------
# 🌍 Global Environment Variables
# -----------------------------------------------------
env:
  # UI
  FRONTEND_PORT: 4200
  BASE_URL: http://127.0.0.1:4200

  # Test Execution
  EXECUTION_TYPE: localHeadless
  BROWSER: Edge
  TEST_PATTERN: "*Test,*TEST,*test*"

  # MongoDB (local – self-hosted)
  MONGO_URI: mongodb://localhost:27017
  MONGO_DB: Quiz

jobs:
  login_test:
    name: 🧪 Login Regression Tests
    runs-on: self-hosted

    steps:
      # -----------------------------------------------------
      # 1️⃣ Checkout Repository
      # -----------------------------------------------------
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 2️⃣ Setup Java
      # -----------------------------------------------------
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------------------
      # 3️⃣ Verify Environment (Debug)
      # -----------------------------------------------------
      - name: 🔍 Verify Environment
        run: |
          echo "Java:"
          java -version
          echo "Maven:"
          mvn -version
          echo "BASE_URL=$BASE_URL"
          echo "BROWSER=$BROWSER"
          echo "EXECUTION_TYPE=$EXECUTION_TYPE"
          echo "MONGO_URI=$MONGO_URI"
          echo "MONGO_DB=$MONGO_DB"


      - name: 🗄️ Check MongoDB
        run: |
          netstat -an | grep 27017 || echo "MongoDB not running!"

      # -----------------------------------------------------
      # 4️⃣ Run Regression Tests
      # -----------------------------------------------------
      - name: 🧪 Run Regression Tests
        continue-on-error: true
        run: |
          mvn test \
            -Dtest="$TEST_PATTERN" \
            -DexecutionType="$EXECUTION_TYPE" \
            -DbrowserType="$BROWSER" \
            -DbaseUrl="$BASE_URL" \
            -Dmongo.uri="$MONGO_URI" \
            -Dmongo.db="$MONGO_DB"

      # -----------------------------------------------------
      # 5️⃣ Upload Test Results
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RegressionTest
          path: test-output/reports/*.html

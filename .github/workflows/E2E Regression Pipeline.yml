name: E2E Regression

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  # تأكد أن اختبارات السيلينيوم لديك مهيئة لتقرأ الرابط الصحيح (http://localhost:4600)
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:

  Edge_Windows_Test:
    runs-on: windows-latest
    permissions:
      checks: write

    steps:

      # -----------------------------------------------------
      # Checkout the repository
      # -----------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Node + Angular Setup & Build
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Angular Dependencies
        working-directory: POS-19-10-2025/pos-front-app
        run: npm install

      # خطوة جديدة: بناء المشروع لإنتاج مجلد dist
      - name: Build Angular Project
        working-directory: POS-19-10-2025/pos-front-app
        run: npm run build

      # خطوة معدلة: تشغيل http-server بدلاً من npm start
      # ملاحظة: تأكد من مسار مجلد dist الصحيح (قد يكون dist/POSFront أو dist/pos-front-app)
      - name: Start http-server (background)
        working-directory: POS-19-10-2025/pos-front-app
        shell: pwsh
        run: |
          npm install -g http-server
          # نقوم بتشغيل السيرفر وتوجيهه لمجلد الـ build (غالباً يكون اسمه dist واسم المشروع بداخله)
          # استبدل "dist/YOUR_PROJECT_NAME" بالمسار الصحيح الذي يظهر بعد الـ build
          # بناء على مسارك المحلي سأفترض أنه يخدم المجلد الحالي أو dist مباشرة
          Start-Job -ScriptBlock { http-server ./dist/pos-front-app -p 4600 }
          Start-Sleep -Seconds 5

      - name: Wait until App is running (Port 4600)
        shell: pwsh
        run: |
          $max = 30
          for ($i=0; $i -lt $max; $i++) {
            try {
              # تم تغيير المنفذ إلى 4600
              Invoke-WebRequest -Uri "http://localhost:4600" -UseBasicParsing | Out-Null
              Write-Host "Angular Frontend is UP on port 4600!"
              exit 0
            } catch {
              Write-Host "Waiting for Angular on port 4600..."
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # Java + Maven + Selenium
      # -----------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # تأكد من تمرير الرابط الأساسي (Base URL) للاختبارات إذا كانت تحتاج ذلك
      - name: Run Selenium Tests (Edge)
        run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://localhost:4600" clean test

      # -----------------------------------------------------
      # Upload Reports
      # -----------------------------------------------------
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Edge_Windows_Report
          path: test-output/reports/*.html
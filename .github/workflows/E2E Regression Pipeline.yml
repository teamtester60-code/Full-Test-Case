name: E2E Regression (Login Test - Full Stack)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  # -----------------------------------------------------
  # 📌 إعدادات المنافذ والمسارات (Ports and Paths)
  # -----------------------------------------------------
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  BACKEND_PUBLISH_DIR: POS-19-10-2025/POS-BackPublish

  FRONTEND_PORT: 4300
  BACKEND_API_PORT: 5000
  ASPNETCORE_URLS: http://127.0.0.1:5000

  LOGIN_TEST_TARGET: "LoginTest"

jobs:
  Login_Test:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
      checks: write

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 1. إعداد الخدمات المساعدة (MongoDB المُعدّة مسبقاً)
      # -----------------------------------------------------
      - name: 🛠️ Build Custom Seeded MongoDB Image (using /db_setup)
        # 🛑 يجب أن يكون مجلد db_setup/ موجوداً في Git
        run: docker build -t seeded-mongo ./db_setup

      - name: 🚀 Start Custom MongoDB Container and Wait (Seeded DB)
        shell: pwsh
        run: |
            $containerID = docker run --name mongodb -p 27017:27017 -d seeded-mongo
            echo "MongoDB Container ID: $containerID"
            
            $MAX_ATTEMPTS = 60 # 120s total
            
            echo "Starting log check loop for MongoDB..."
            
            # 🛑 تم تصحيح الخطأ النحوي: إزالة الفاصلة المنقوطة قبل القوس '}'
            for ($i = 1; $i -le $MAX_ATTEMPTS) {
                $logOutput = docker logs mongodb 2>&1
            
                if ($logOutput -like "*Waiting for connections*") {
                    echo "✅ MongoDB Server is UP. Allowing 10 seconds for data restoration to complete..."
            
                    # وقت ثابت لضمان اكتمال mongorestore
                    Start-Sleep -Seconds 10
                    exit 0
                }
                echo "Waiting for MongoDB to start... ($i/$MAX_ATTEMPTS)"
                Start-Sleep -Seconds 2
            }
            
            echo "❌ MongoDB FAILED to start!"
            docker logs mongodb
            exit 1
          
          
      - name: 🔎 Verify Database Seeding
        shell: bash
        run: |
            sleep 5 && docker exec mongodb mongosh --eval "db.adminCommand({ listDatabases: 1, nameOnly: true })" | grep pos_db
      # -----------------------------------------------------
      # 2. تشغيل الواجهة الخلفية (Backend)
      # -----------------------------------------------------
      - name: ⚙️ Install Required .NET Runtime 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: 🚀 Start Backend Service (Port 5000)
        shell: bash
        env:
            ASPNETCORE_URLS: ${{ env.ASPNETCORE_URLS }}
            # 🛑 تحديث: إضافة اسم قاعدة البيانات /pos_db/ إلى سلسلة الاتصال
            MongoConnection__ConnectionString: mongodb://127.0.0.1:27017/pos_db?minPoolSize=10&maxPoolSize=50
            ApplicationSettings__Report_Connection: mongodb://127.0.0.1:27017/pos_db

        run: |
          PUBLISH_DIR="${{ env.BACKEND_PUBLISH_DIR}}"
          LOG_FILE="$PUBLISH_DIR/backend.log"
          
          echo "Starting .NET Kestrel server on port ${{ env.BACKEND_API_PORT }} using EXE via Bash"
          
          cd $PUBLISH_DIR
          nohup ./POS.Web.exe > backend.log 2>&1 &
          cd -
          
          sleep 10
          echo "--- Backend Log Snippet (After 10s) ---"
          cat $LOG_FILE
          echo "---------------------------"

      - name: ⏱️ Wait until Backend API is running (on 5000)
        shell: bash
        run: |
          MAX_ATTEMPTS=40
          API_URL="http://127.0.0.1:${{ env.BACKEND_API_PORT }}" 
          
          echo "Starting wait loop for API on $API_URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$API_URL")
          
            if [[ "$HTTP_CODE" =~ ^(200|401)$ ]]; then 
              echo "✅ Backend API is UP on port ${{ env.BACKEND_API_PORT }} with status code $HTTP_CODE!"
              exit 0
            else
              echo "Waiting for API on port ${{ env.BACKEND_API_PORT }}... ($i/$MAX_ATTEMPTS) (Current status: $HTTP_CODE)"
              sleep 3
            fi
          done
          echo "❌ Backend API FAILED to start!"
          
          echo "--- Final Backend Log for Diagnosis ---"
          cat ${{ env.BACKEND_PUBLISH_DIR }}/backend.log
          echo "---------------------------------------"
          
          exit 1

      # -----------------------------------------------------
      # 3. تشغيل الواجهة الأمامية (Frontend)
      # -----------------------------------------------------
      - name: ⚙️ Setup Node.js (for serve)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🛠️ Install serve Globally
        run: npm install -g serve

      - name: 🩹 Fix Angular Base Href (PowerShell)
        shell: pwsh
        run: |
          $indexPath = "./${{ env.FRONTEND_BUILD_DIR }}/index.html"
          (Get-Content -Path $indexPath) -replace '<base href="/">', '<base href="./">' | Set-Content $indexPath

      - name: 🚀 Start Frontend Server (Port ${{ env.FRONTEND_PORT }})
        shell: bash
        run: |
          BUILD_DIR="./${{ env.FRONTEND_BUILD_DIR }}"
          nohup serve -s "$BUILD_DIR" -l ${{ env.FRONTEND_PORT }} > server.log 2>&1 &
          sleep 5
          cat server.log

      - name: ⏱️ Wait until Frontend App is running
        shell: bash
        run: |
          MAX_ATTEMPTS=30
          URL="http://127.0.0.1:${{ env.FRONTEND_PORT }}"
          
          echo "Starting wait loop using curl on $URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -s --head --fail "$URL" ; then
              echo "✅ Angular Frontend is UP on port ${{ env.FRONTEND_PORT }}!"
              exit 0
            else
              echo "Waiting for Angular on port ${{ env.FRONTEND_PORT }}... ($i/$MAX_ATTEMPTS)"
              sleep 3
            fi
          done
          echo "❌ Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 4. تشغيل اختبارات الأتمتة
      # -----------------------------------------------------
      - name: ☕ Setup Java (for Selenium Tests)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven (for Selenium Tests)
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 🧪 Run Login Test
        run: mvn -Dtest=${{ env.LOGIN_TEST_TARGET }} -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://127.0.0.1:${{ env.FRONTEND_PORT }}" test

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Login_Test_Report
          path: test-output/reports/*.html
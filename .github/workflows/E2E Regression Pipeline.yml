name: E2E Regression - Login Test (Self-hosted)

on:
  push:
    branches: [ master, main ]

  pull_request:
    branches: [ master, main ]

  schedule:
    # ⏰ 9:30 AM & 10:30 AM UTC
    - cron: '30 9,10 * * *'

  workflow_dispatch:

# -----------------------------------------------------
# 🌍 متغيرات عامة لكل الـ Jobs
# -----------------------------------------------------
env:
  FRONTEND_PORT: 4200
  LOGIN_TEST_TARGET: RegressionTest
  BASE_URL: http://127.0.0.1:4200
  BROWSER: Edge
  EXECUTION_TYPE: localHeadless

jobs:
  login_test:
    name: 🧪 Login Regression Tests
    runs-on: self-hosted

    steps:
      # -----------------------------------------------------
      # 1️⃣ Checkout Repository
      # -----------------------------------------------------
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 2️⃣ Setup Java
      # -----------------------------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -----------------------------------------------------
      # 3️⃣ Verify Environment (Debug step)
      # -----------------------------------------------------
      - name: 🔍 Verify Environment
        run: |
          java -version
          mvn -version
          echo "Base URL: $BASE_URL"
          echo "Browser: $BROWSER"
          echo "Execution Type: $EXECUTION_TYPE"

      # -----------------------------------------------------
      # 4️⃣ Run Regression Tests
      # -----------------------------------------------------
      - name: 🧪 Run Regression Tests
        continue-on-error: true
        run: |
          mvn test \
            -Dtest="*Test,*TEST,*test*" \
            -DexecutionType=${EXECUTION_TYPE} \
            -DbrowserType=${BROWSER} \
            -DbaseUrl=${BASE_URL}

      # -----------------------------------------------------
      # 5️⃣ Upload Test Results
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-test-results
          path: test-output/reports/*.html

name: E2E Regression - Login Test (Self-hosted)

on:
  push:
    branches: [ master, main ]

  pull_request:
    branches: [ master, main ]

  schedule:
    # ⏰ 9:30 AM & 10:30 AM UTC
    - cron: '30 9,10 * * *'

  workflow_dispatch:

# -----------------------------------------------------
# 🌍 Global Environment Variables
# -----------------------------------------------------
env:
  # UI
  FRONTEND_PORT: 4200
  BASE_URL: http://127.0.0.1:4200

  # Test Execution
  EXECUTION_TYPE: Headless
  BROWSER: Edge
  TEST_PATTERN: "*Test,*TEST,*test*"

  # MongoDB (local – self-hosted)
  MONGO_URI: mongodb://localhost:27017
  MONGO_DB: Quiz

jobs:
  login_test:
    runs-on: self-hosted
    env:
      FRONTEND_PORT: 4200
      BASE_URL: http://127.0.0.1:4200
      EXECUTION_TYPE: Headless
      BROWSER: Edge
      TEST_PATTERN: "*Test,*TEST,*test*"
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: Quiz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check MongoDB
        shell: powershell
        run: |
          if (!(netstat -an | findstr "27017")) {
            Write-Host "MongoDB not running!"
            exit 1
          } else {
            Write-Host "MongoDB is running on port 27017"
          }

      - name: Run Regression Tests
        shell: powershell
        run: mvn test `
          -Dtest=$env:TEST_PATTERN `
          -DexecutionType=$env:EXECUTION_TYPE `
          -DbrowserType=$env:BROWSER `
          -DbaseUrl=$env:BASE_URL `
          -Dmongo.uri=$env:MONGO_URI `
          -Dmongo.db=$env:MONGO_DB


      # -----------------------------------------------------
      # 5️⃣ Upload Test Results
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RegressionTest
          path: test-output/reports/*.html

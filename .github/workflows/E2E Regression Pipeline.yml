name: E2E Regression - Login Test (Self-hosted)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # ⏰ 9:30 AM & 10:30 AM UTC
    - cron: '30 9,10 * * *'
  workflow_dispatch:

# -----------------------------------------------------
# 🌍 Global Environment Variables
# -----------------------------------------------------
env:
  # UI
  FRONTEND_PORT: 4200
  BASE_URL: http://127.0.0.1:4200

  # Test Execution
  EXECUTION_TYPE: Headless
  BROWSER: Edge
  TEST_PATTERN: "*Test,*TEST,*test*"

  # MongoDB (local – self-hosted)
  MONGO_URI: mongodb://localhost:27017
  MONGO_DB: Quiz

jobs:
  login_test:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout Repository
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Verify Environment
      - name: 🔍 Verify Environment
        shell: powershell
        run: |
          java -version
          mvn -version
          echo "Base URL: %BASE_URL%"
          echo "Browser: %BROWSER%"
          echo "Execution Type: %EXECUTION_TYPE%"
          echo "Mongo URI: %MONGO_URI%"
          echo "Mongo DB: %MONGO_DB%"

      # 4️⃣ Check MongoDB Running
      - name: ✅ Check MongoDB
        shell: powershell
        run: |
          if (!(netstat -an | findstr "27017")) {
            Write-Host "MongoDB not running!"
            exit 1
          } else {
            Write-Host "MongoDB is running on port 27017"
          }

      # 5️⃣ Run Regression Tests
      - name: 🧪 Run Regression Tests
        shell: powershell
        run: mvn test -Dtest=%TEST_PATTERN% -DexecutionType=%EXECUTION_TYPE% -DbrowserType=%BROWSER% -DbaseUrl=%BASE_URL% -Dmongo.uri=%MONGO_URI% -Dmongo.db=%MONGO_DB%

      # 6️⃣ Upload Test Results
      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RegressionTest
          path: test-output/reports/*.html

name: E2E Regression (Login Test Only - Static Service)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  LOGIN_TEST_TARGET: "LoginTest"

jobs:

  Login_Test:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
      checks: write

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (for server)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🛑 التعديل 1: تثبيت حزمة 'serve'
      - name: 🛠️ Install serve Globally
        run: npm install -g serve

      - name: 🩹 Fix Angular Base Href
        shell: pwsh
        run: |
          $indexPath = "./${{ env.FRONTEND_BUILD_DIR }}/index.html"
          Write-Host "Modifying base href in ${indexPath}: / -> ./"
          (Get-Content -Path $indexPath) -replace '<base href="/">', '<base href="./">' | Set-Content $indexPath

      # 🛑 التعديل 2: استخدام 'serve' مع خيار -s (Single Page Application mode)
      - name: 🚀 Start Frontend Server (Port 4300)
        shell: bash
        run: |
          BUILD_DIR="./${{ env.FRONTEND_BUILD_DIR }}"
          echo "Starting serve with SPA mode on port 4300"
          # -s: لتمكين وضع SPA (توجيه 404 إلى index.html)، -l: لتحديد المنفذ
          nohup serve -s "$BUILD_DIR" -l 4300 > server.log 2>&1 &
          sleep 5
          cat server.log

      - name: ⏱️ Wait until App is running on Port 4300 (using curl/bash)
        shell: bash
        run: |
          MAX_ATTEMPTS=30
          URL="http://127.0.0.1:4300"
          
          echo "Starting wait loop using curl on $URL"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -s --head --fail "$URL" ; then
              echo "✅ Angular Frontend is UP on port 4300!"
              exit 0
            else
              echo "Waiting for Angular on port 4300... ($i/$MAX_ATTEMPTS)"
              sleep 3
            fi
          done
          echo "❌ Angular FAILED to start!"
          exit 1

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 🧪 Run Login Test
        run: mvn -Dtest=${{ env.LOGIN_TEST_TARGET }} -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://127.0.0.1:4300" test

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Login_Test_Report
          path: test-output/reports/*.html
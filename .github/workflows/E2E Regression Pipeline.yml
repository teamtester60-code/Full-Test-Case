name: E2E Regression (Fast Run - Skip Frontend Build)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  # مسار مجلد البناء الذي يحتوي على index.html
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:

  Edge_Windows_Test:
    runs-on: windows-latest
    permissions:
      checks: write

    steps:

      # -----------------------------------------------------
      # 1. Checkout the repository
      # -----------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 2. Node Setup & Start http-server
      # (نقوم بتثبيت Node فقط لاستخدام npm لتثبيت http-server)
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # تثبيت http-server عالمياً (يجب أن يتم مرة واحدة)
      - name: Install http-server Globally
        run: npm install -g http-server

      # تشغيل http-server لخدمة مجلد البناء (في الخلفية)
      - name: Start http-server (Background on Port 4600)
        shell: pwsh
        run: |
          # تشغيل السيرفر وتوجيهه لمجلد البناء
          Start-Job -ScriptBlock { http-server ./${{ env.FRONTEND_BUILD_DIR }} -p 4600 }
          Start-Sleep -Seconds 5
        # 👇 الخطوة الجديدة: لفحص محتويات المجلد
      - name: 🔎
        run: Get-ChildItem -Path ./${{ env.FRONTEND_BUILD_DIR }}
        shell: pwsh

      # انتظار تشغيل التطبيق
      - name: Wait until App is running on Port 4600
        shell: pwsh
        run: |
          $max = 30
          for ($i=0; $i -lt $max; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:4600" -UseBasicParsing | Out-Null
              Write-Host "Angular Frontend is UP on port 4600!"
              exit 0
            } catch {
              Write-Host "Waiting for Angular on port 4600..."
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 3. Java + Maven + Selenium
      # -----------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # تمرير المنفذ 4600 إلى اختبارات السيلينيوم
      - name: Run Selenium Tests (Edge)
        run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://localhost:4600" clean test

      # -----------------------------------------------------
      # 4. Upload Reports
      # -----------------------------------------------------
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Edge_Windows_Report
          path: test-output/reports/*.html
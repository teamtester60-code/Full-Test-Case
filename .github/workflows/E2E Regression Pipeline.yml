name: E2E Regression (Fast Run - Static Service)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  FRONTEND_BUILD_DIR: POS-19-10-2025/pos-front-app
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:

  Edge_Windows_Test:
    runs-on: windows-latest
    permissions:
      checks: write

    steps:

      # -----------------------------------------------------
      # 1. إعداد البيئة (Checkout & Node)
      # -----------------------------------------------------
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (for http-server)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # -----------------------------------------------------
      # 2. تشغيل الواجهة الأمامية (Frontend Service)
      # -----------------------------------------------------

      - name: 🛠️ Install http-server Globally
        run: npm install -g http-server

      # 🛑 الخطوة المصححة: تعديل base-href في index.html
      - name: 🩹 Fix Angular Base Href
        shell: pwsh
        run: |
          $indexPath = "./${{ env.FRONTEND_BUILD_DIR }}/index.html"
          Write-Host "Modifying base href in $indexPath: / -> ./"
          
          # استبدال base href="/ " بـ base href="./ "
          (Get-Content -Path $indexPath) -replace '<base href="/">', '<base href="./">' | Set-Content $indexPath

      - name: 🚀 Start Frontend Server (Port 4600)
        shell: pwsh
        run: |
          $BuildPath = "./${{ env.FRONTEND_BUILD_DIR }}"
          Write-Host "Starting http-server on directory: $BuildPath"
          
          # تشغيل http-server في عملية منفصلة
          Start-Process -FilePath "http-server" `
              -ArgumentList $BuildPath, "-p", "4600", "-a", "0.0.0.0", "--silent"

          Start-Sleep -Seconds 5

      # انتظار تشغيل التطبيق (هذه الخطوة يجب أن تنجح الآن)
      - name: ⏱️ Wait until App is running
        shell: pwsh
        run: |
          $max = 30
          for ($i=0; $i -lt $max; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:4600" -UseBasicParsing | Out-Null
              Write-Host "✅ Angular Frontend is UP on port 4600!"
              exit 0
            } catch {
              Write-Host "Waiting for Angular on port 4600... ($($i + 1)/$max)"
              Start-Sleep -Seconds 3
            }
          }
          Write-Host "❌ Angular FAILED to start!"
          exit 1

      # -----------------------------------------------------
      # 3. إعداد Java و Maven
      # -----------------------------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # -----------------------------------------------------
      # 4. تشغيل الاختبارات (Test Execution)
      # -----------------------------------------------------
      - name: 🧪 Run Selenium Tests (Edge)
        run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -DbrowserType="Edge" -DbaseUrl="http://localhost:4600" clean test

      # -----------------------------------------------------
      # 5. رفع التقارير (Artifact Upload)
      # -----------------------------------------------------
      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Edge_Windows_Report
          path: test-output/reports/*.html